name: Update IPTV Playlists

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate playlists
        run: npm run generate

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update playlists [skip ci]"
          git pull --rebase origin main
          git push

  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate EPG
        id: epg
        run: node epg-generate.js

      - name: Commit EPG
        if: steps.epg.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add epg-lb.xml
          if git diff --quiet && git diff --staged --quiet; then
            echo "No EPG changes"
            exit 0
          fi
          git commit -m "chore: update EPG [skip ci]"
          git pull --rebase origin main
          git push

      - name: Alarm bei leerem EPG
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --search "EPG leer" --state open --json number --jq length)
          if [ "$OPEN" = "0" ]; then
            gh issue create --title "EPG leer: epg-lb.xml ohne Daten" \
              --body "Der EPG-Job ist fehlgeschlagen oder liefert keine Sendungen. Bitte epg-generate.js / Quellen prüfen."
          else
            echo "Alarm-Issue bereits offen"
          fi

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Web-Player nach gh-pages spiegeln
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          cp app/src/main/assets/index.html /tmp/pv-index.html
          cp app/src/main/assets/hls.min.js /tmp/pv-hls.min.js
          cp app/src/main/assets/logo.png /tmp/pv-logo.png
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/pv-index.html index.html
          cp /tmp/pv-hls.min.js hls.min.js
          cp /tmp/pv-logo.png logo.png
          git add index.html hls.min.js logo.png
          if git diff --quiet && git diff --staged --quiet; then
            echo "Pages aktuell"
            exit 0
          fi
          git commit -m "chore: update Pages [skip ci]"
          git push origin gh-pages
