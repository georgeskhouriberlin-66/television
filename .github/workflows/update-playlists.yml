name: Update IPTV Playlists

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'iptv-config.yml'
      - 'generate.js'
  repository_dispatch:
    types: [iptv-org-update, manual-trigger]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate playlists
        run: npm run generate
        env:
          ENABLE_ROLLBACK: 'true'

      - name: Validate output
        run: npm run validate

      - name: Commit and push changes
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add arabic.m3u gulf.m3u usa.m3u eastblock.m3u germany.m3u tinyurls.json 
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update IPTV playlists [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
